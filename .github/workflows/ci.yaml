# go-tangra-asterisk CI (go-tangra v4), on the v4 branch; main keeps the v3 code and workflow.
#
# Images: ghcr.io/go-tangra/go-tangra-asterisk tagged <version>, <major>.<minor>, <major> (from tags vX.Y.Z)
# and sha-<short> (v4 branch pushes and tags). There is deliberately NO `latest`,
# NO branch tag and NO registry cleanup job: the v3.x images published by the old
# workflow must stay available.
#
# SDK releases: this repository has no sdk/ module; if one is added it is tagged `sdk/vX.Y.Z` by hand.
# The tag filter 'v*' is a glob anchored at the start of the tag name (`*` does not
# cross `/`), so `sdk/v4.0.0` never matches it and never builds or pushes an image.
name: CI

on:
  push:
    branches:
      - v4
    tags:
      - 'v*'
  pull_request:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: 'off'
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/go-tangra/go-tangra-asterisk

jobs:
  go:
    name: Go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum

      - name: go vet (service)
        run: go vet ./...

      - name: go test -race (service)
        run: go test -race ./...

  ui:
    name: UI lint + unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@go-tangra'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

  # Standalone .deb and .rpm (packaging/nfpm.yaml) for linux amd64 and arm64:
  # the join bundle's install-standalone.sh installs them instead of the
  # container. Tags build their version; other builds `git describe`. The
  # amd64 .deb is installed and purged on the runner as a smoke test.
  packages:
    name: Standalone packages
    runs-on: ubuntu-latest
    needs:
      - go
      - ui
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags

      - name: shellcheck
        run: shellcheck deploy/bundle/install-standalone.sh packaging/scripts/*.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@go-tangra'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm --prefix ui ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(git describe --tags --match 'v*' --always | sed 's/^v//')"; fi
          echo "PKG_VERSION=${v}" >> "${GITHUB_ENV}"

      - name: Build the packages
        run: make packages VERSION="${PKG_VERSION}"

      - name: Inspect packages
        run: |
          sudo apt-get install -y --no-install-recommends rpm >/dev/null
          ls -l dist
          for f in dist/*.deb; do dpkg-deb --info "$f" | sed -n '/Package:/,/Depends:/p'; dpkg-deb -c "$f"; done
          for f in dist/*.rpm; do rpm -qpi "$f" | grep -E '^(Name|Version|Architecture)'; rpm -qpl "$f"; done

      - name: Install smoke test (amd64 .deb)
        run: |
          sudo apt-get install -y ./dist/*_amd64.deb
          test -x /usr/bin/asterisksvc
          getent passwd tangra-asterisk
          test "$(sudo stat -c '%a %U:%G' /etc/tangra-asterisk)" = "750 root:tangra-asterisk"
          systemctl cat tangra-asterisk.service >/dev/null
          # Not enabled or started: no configuration yet.
          if systemctl is-active --quiet tangra-asterisk.service; then echo "started without a configuration" >&2; exit 1; fi
          sudo apt-get purge -y tangra-asterisk
          test ! -e /usr/bin/asterisksvc
          test ! -e /etc/tangra-asterisk

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - go
      - ui
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build (push on tags and v4 pushes only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

  # Module catalogue entry (spec 035): on a release tag, publish
  # catalogue-entry.json and bundle.zip (tangra-module.yaml, deploy/bundle/)
  # with a GitHub artifact attestation, so gateways can list and install this
  # release. Runs after the image is pushed: the action checks it is pullable.
  # The standalone packages' checksums go into the bundle (packages.sha256,
  # read by install-standalone.sh) and the packages onto the release.
  catalogue:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Pin the package checksums in the bundle
        run: cp dist/SHA256SUMS deploy/bundle/packages.sha256 && cat deploy/bundle/packages.sha256
      - uses: go-tangra/go-tangra/.github/actions/catalogue-entry@v4.9.0
        with:
          tool-version: v4.9.0
          permissions-command: go run ./cmd/asterisk-catalogue-permissions
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" --clobber dist/*
