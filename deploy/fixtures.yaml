# Dedicated disposable databases only. Run from deploy/ with a local Docker account.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: fixture-only
    ports: ["127.0.0.1:13306:3306"]
    volumes:
      - ../tests/integration/fixtures/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pfixture-only"]
      interval: 2s
      retries: 30
