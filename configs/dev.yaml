service_name: asterisk
trust_domain: tangra.local
env: development
# The module obtains its mesh SVID by enrolling with lcm over the network,
# like every go-tangra v4 module (a SPIRE agent is not required; with one,
# use identity.provider: spiffe and workload_socket instead).
identity:
  provider: provided
mesh_enroll:
  enabled: true
  enroll_url: ${ASTERISK_ENROLL_URL}
  lcm_grpc: ${ASTERISK_LCM_GRPC}
  tenant_id: ${ASTERISK_ENROLL_TENANT_ID}
  token_file: ${ASTERISK_ENROLL_TOKEN_FILE}
  state_file: ${ASTERISK_ENROLL_STATE_FILE}
authz:
  source: file
  path: deploy/policy.yaml
server:
  http_addr: :8444
  grpc_addr: :9444
admin:
  addr: 127.0.0.1:9094
discovery:
  static:
    auth: ["${ASTERISK_AUTH_TARGET}"]
    gateway: ["${ASTERISK_PORTAL_TARGET}"]
binding:
  tenant_id: ${ASTERISK_TENANT_ID}
  pbx_id: ${ASTERISK_PBX_ID}
  cdr_dsn: ${ASTERISK_CDR_DSN}
  config_dsn: ${ASTERISK_CONFIG_DSN}
  registration_dsn: ${ASTERISK_REGISTRATION_DSN}
  # Registration events older than this are pruned hourly (0 keeps them forever).
  registration_retention_days: 400
  recording_root: ${ASTERISK_RECORDING_ROOT}
  timezone: Europe/Sofia
  source_timezone: Europe/Sofia
  monitoring_url: ${ASTERISK_MONITORING_URL}
  monitoring_dedicated: true
ami:
  enabled: false
gateway:
  service: gateway
  issuer: ${ASTERISK_AUTH_ISSUER}
query_timeout_seconds: 5
stream_seconds: 240
